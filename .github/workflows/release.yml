name: Release

# Packaging and upload run on tags only. The BigWigs packager reads the project
# ids from Tallymaster.toc (X-Curse-Project-ID, X-Wago-ID), pulls the libraries
# listed in .pkgmeta and builds the changelog from CHANGELOG.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          # the packager needs the full history to build the changelog
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          # Tokens live in the repository secrets, never in the repo.
          # Missing ones just skip that upload target.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
